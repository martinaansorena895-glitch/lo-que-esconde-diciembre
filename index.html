

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lo que esconde diciembre</title>
    <link rel="stylesheet" href="style.css?v=4">
</head>

<body>

    <!-- PORTADA -->
    <main id="cover" class="cover">

        <div class="cover-decoration decoration-top">✳</div>
        <div class="cover-decoration decoration-left">✧</div>
        <div class="cover-decoration decoration-right">✧</div>

        <div class="cover-content">
            <p class="cover-label">A LITTLE SOMETHING FOR YOU</p>
            <div class="ornament">✦ ───── ✦</div>
            <h1>Lo que esconde diciembre</h1>
            <p class="cover-subtitle">Te amo</p>

            <button id="enterButton" class="enter-button">
                Tocar para descubrir
                <span>↗</span>
            </button>

            <p class="cover-footer">DICIEMBRE · 2026</p>
        </div>

    </main>

    <!-- CALENDARIO -->
    <section id="calendar" class="calendar hidden">

        <header class="calendar-header">
            <p class="eyebrow">DICIEMBRE · 2026</p>
            <h2>24 días, 24 sorpresas.</h2>
            <p>Hay cosas que merecen ser descubiertas de a poco.</p>
        </header>

        <div id="daysGrid" class="days-grid"></div>

    </section>

    <!-- VENTANA DE SORPRESAS -->
    <div id="surpriseModal" class="modal hidden">
        <div class="modal-content">
            <button id="closeModal" class="close-button">×</button>
            <p id="surpriseNumber" class="eyebrow"></p>
            <h2 id="surpriseTitle"></h2>
            <p id="surpriseText"></p>
            <div id="surpriseContent" class="surprise-content"></div>
        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
